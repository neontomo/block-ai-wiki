<svg
	xmlns="http://www.w3.org/2000/svg"
	width="88"
	height="20"
	role="img"
	aria-label="AI free"
>
	<title>AI free</title>

	<g clip-path="url(#r)">
		<rect width="20" height="20" fill="#444" />
		<rect x="20" width="35" height="20" fill="#e7000b" />
	</g>

	<g
		fill="#fff"
		text-anchor="middle"
		font-family="Arial, Helvetica, sans-serif"
