<svg
	xmlns="http://www.w3.org/2000/svg"
	width="60"
	height="20"
	role="img"
	aria-label="AI: FREE"
>
	<title>AI: FREE</title>
	<g shape-rendering="crispEdges">
		<rect width="23" height="20" fill="#555" />
		<rect x="23" width="37" height="20" fill="#e7000b" />
	</g>
	<g
		fill="#fff"
		text-anchor="middle"
		font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
		text-rendering="geometricPrecision"
		font-size="110"
	>
		<text x="125" y="140" textLength="130" transform="scale(.1)">AI</text>
		<text x="405" y="140" textLength="270" transform="scale(.1)">FREE</text>
	</g>
</svg>
